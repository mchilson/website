name: Jekyll site CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'          # works well with github-pages gem
        bundler-cache: true          # caches gems between runs

    - name: Build the site
      run: bundle exec jekyll build --future